[Unit]
Wants=network-online.target
After=network-online.target nabd.service
# Not Requires=: AirPlay problems must not affect Pynab and vice versa.

[Service]
Restart=on-failure
RestartSec=5
# If Shairport dies without ending its session, give the sound back to Pynab.
ExecStopPost=-/bin/bash @ROOT_DIR@/nabairplay/airplay-off.sh
